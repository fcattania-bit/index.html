<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SISTEMA ER9 - Control de Flota y Dron V4</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-panel: #111827;
      --bg-card: #1F2937;
      --border-color: #374151;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --accent-cyan: #06B6D4;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --accent-wilson: #8B5CF6;
      --accent-maps: #2563EB;
      --accent-wsp: #25D366;
      --accent-drone: #F59E0B;
    }
  
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      height: 100vh; 
      width: 100vw;
      display: flex; 
      overflow: hidden; 
    }

    .mapa-modo-noche {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }

    #sidebar {
      width: 390px;
      height: 100vh;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }

    .header-panel {
      flex-shrink: 0;
      padding: 12px 14px;
      background: linear-gradient(180deg, #162032 0%, var(--bg-panel) 100%);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title-row h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .wilson-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--accent-wilson);
      color: #DDD6FE;
      padding: 4px 8px;
      border-radius: 16px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .wilson-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-wilson);
      box-shadow: 0 0 6px var(--accent-wilson);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .caja-consulta-wilson {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .caja-consulta-wilson input {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--accent-wilson);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      outline: none;
      width: 120px;
    }

    .caja-consulta-wilson input::placeholder {
      color: var(--text-muted);
    }

    .btn-enviar-consulta {
      background: var(--accent-wilson);
      border: none;
      color: #fff;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .btn-enviar-consulta:hover {
      background: #7C3AED;
      box-shadow: 0 0 8px var(--accent-wilson);
    }

    .btn-mic-wilson {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid var(--accent-wilson);
      color: #DDD6FE;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .btn-mic-wilson:hover {
      background: var(--accent-wilson);
      color: #fff;
    }

    .btn-mic-wilson.escuchando {
      background: var(--accent-red);
      border-color: #FCA5A5;
      color: #FFFFFF;
      animation: latidoMic 1s infinite;
    }

    @keyframes latidoMic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    #alerta-banner {
      display: none;
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.95) 0%, rgba(185, 28, 28, 0.95) 100%);
      border: 1px solid #f87171;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
      color: #FFFFFF;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      animation: deslizarAbajo 0.3s ease-out;
    }

    @keyframes deslizarAbajo {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alerta-icono-campana {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #FEE2E2;
      animation: repiqueCampana 1s infinite ease-in-out;
      transform-origin: top center;
    }

    @keyframes repiqueCampana {
      0% { transform: rotate(0); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-14deg); }
      45% { transform: rotate(10deg); }
      60% { transform: rotate(-10deg); }
      75% { transform: rotate(4deg); }
      100% { transform: rotate(0); }
    }

    .alerta-cuerpo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .btn-desactivar-alerta {
      background: #FFFFFF;
      color: #B91C1C;
      border: none;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.68rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-desactivar-alerta:active {
      transform: scale(0.95);
    }

    .controles-superiores-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .fecha-filter-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 8px;
    }

    .fecha-filter-box label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fecha-filter-box input[type="date"] {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      outline: none;
      color-scheme: dark;
    }

    .btn-toggle-dron-master {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--accent-drone);
      color: var(--accent-drone);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-toggle-dron-master.activo {
      background: var(--accent-drone);
      color: #000;
    }

    .drone-command-panel {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--accent-drone);
      border-radius: 6px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      animation: deslizarAbajo 0.2s ease-out;
    }

    .drone-command-panel.visible {
      display: flex;
    }

    .drone-command-title {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent-drone);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-transform: uppercase;
    }

    .drone-buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    .btn-drone-cmd {
      background-color: var(--bg-card);
      border: 1px solid var(--accent-drone);
      color: var(--text-main);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-drone-cmd:hover {
      background-color: var(--accent-drone);
      color: #000;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .stat-item {
      background-color: var(--bg-card);
      padding: 4px 2px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .stat-val { font-size: 0.95rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .stat-lbl { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }

    #lista-moviles {
      flex: 1 1 auto;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch !important;
      touch-action: pan-y !important;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      pointer-events: auto !important;
    }

    .card-movil {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      flex-shrink: 0;
    }

    .card-movil.selected {
      border-color: var(--accent-cyan);
      background-color: #1E293B;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .movil-nombre { font-weight: 700; font-size: 0.88rem; color: #FFF; }
    .movil-id { font-size: 0.65rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .movil-badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .badge-movimiento { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-detenido { background-color: rgba(156, 163, 175, 0.2); color: var(--text-muted); border: 1px solid var(--border-color); }

    .card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .card-telemetria-extra {
      display: flex;
      gap: 8px;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      flex-wrap: wrap;
    }

    .telemetria-pill {
      background: rgba(11, 15, 25, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(55, 65, 81, 0.8);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-vel {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .card-acciones {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }

    .btn-accion {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      border-radius: 6px;
      padding: 6px 2px;
      font-size: 0.65rem;
      font-weight: 700;
      text-decoration: none;
      color: #FFFFFF;
      cursor: pointer;
    }

    .btn-street { background-color: var(--accent-maps); }
    .btn-wsp { background-color: var(--accent-wsp); }
    .btn-ruta { background-color: var(--accent-wilson); }
    .btn-drone { background-color: var(--accent-drone); color: #000; }
    .btn-cam { background-color: var(--accent-red); color: #FFF; }
    .btn-cam:hover { background-color: #DC2626; }

    #map { flex: 1; height: 100%; width: 100%; background-color: #0b0f19; position: relative; }

    .custom-movil-label {
      background: rgba(17, 24, 39, 0.95);
      border-radius: 6px;
      padding: 4px 8px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      white-space: nowrap;
      text-align: center;
      user-select: none;
      cursor: pointer;
    }

    .neonu-detenido { box-shadow: 0 0 6px rgba(255, 165, 0, 0.7); border: 1.5px solid #ffa500; }
    .neonu-movimiento { box-shadow: 0 0 8px rgba(16, 185, 129, 0.9); border: 1.5px solid var(--accent-green); }
  
    .drone-cam-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 300px;
      height: 195px;
      background-color: var(--bg-panel);
      border: 2px solid var(--accent-drone);
      border-radius: 8px;
      z-index: 1050;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
    }

    .drone-cam-container.oculto {
      display: none !important;
    }

    .drone-cam-header {
      flex-shrink: 0;
      background: rgba(245, 158, 11, 0.25);
      padding: 4px 8px;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--accent-drone);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .drone-video-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000;
      overflow: hidden;
    }

    .drone-cam-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      border: none;
      object-fit: cover;
    }
  
    .movil-cam-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      height: 220px;
      background-color: var(--bg-panel);
      border: 2px solid var(--accent-red);
      border-radius: 8px;
      z-index: 1100;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
      display: flex;
      flex-direction: column;
    }

    .movil-cam-container.oculto {
      display: none !important;
    }

    .movil-cam-header {
      flex-shrink: 0;
      background: rgba(239, 68, 68, 0.2);
      padding: 5px 8px;
      font-size: 0.68rem;
      font-weight: 800;
      color: #F87171;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .movil-cam-header .btn-cerrar-cam {
      background: transparent;
      border: none;
      color: #FFF;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .movil-cam-video {
      width: 100%;
      flex: 1;
      background: #000;
      object-fit: cover;
    }

    .movil-cam-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
      padding: 12px;
      text-align: center;
      background: #0B0F19;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .btn-abrir-stream-ext {
      background: var(--accent-red);
      color: #FFF;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #ruta-info-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border-radius: 8px;
      padding: 8px 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      max-width: 300px;
    }

    .ruta-info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent-cyan);
    }

    .btn-cerrar-ruta {
      background: transparent;
      border: none;
      color: var(--accent-red);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .leyenda-dias {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.7rem;
    }

    .item-leyenda-dia {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot-leyenda {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      body { 
        flex-direction: column; 
        height: 100vh; 
        height: 100dvh; 
      }
      #map { 
        order: 1; 
        height: 50vh !important; 
        height: 50dvh !important; 
        width: 100vw; 
        flex: none; 
      }
      #sidebar { 
        order: 2; 
        width: 100vw; 
        height: 50vh !important; 
        height: 50dvh !important; 
        max-height: 50vh !important; 
        border-right: none; 
        border-top: 2px solid var(--accent-cyan); 
      }
      .drone-cam-container { 
        width: 210px; 
        height: 142px; 
        bottom: 8px; 
        left: 8px; 
      }
      .drone-cam-header {
        padding: 3px 6px;
        font-size: 0.58rem;
      }
      .movil-cam-container { 
        width: 190px; 
        height: 130px; 
        bottom: 8px; 
        right: 8px; 
      }
    }
  </style>
</head>
<body>
  <div id="map">
    <div id="drone-cam-box" class="drone-cam-container oculto">
      <div class="drone-cam-header">
        <span><i class="fa-solid fa-video"></i> VIVO - DRON ER9</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 0.55rem; color: #10B981;"><i class="fa-solid fa-circle"></i> REC</span>
          <button onclick="cerrarConsolaDron()" style="background: transparent; border: none; color: #FFF; cursor: pointer; font-size: 0.75rem;" title="Cerrar Dron"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="drone-video-wrapper">
        <iframe class="drone-cam-video" 
          src="https://www.youtube.com/embed/8UBstbQjySY?autoplay=1&mute=1&loop=1&playlist=8UBstbQjySY&playsinline=1&controls=0&modestbranding=1&rel=0" 
          title="Vista aérea - Dron ER9" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div id="movil-cam-box" class="movil-cam-container oculto">
      <div class="movil-cam-header">
        <span id="movil-cam-titulo"><i class="fa-solid fa-video"></i> CÁMARA EN VIVO</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span id="movil-cam-rec-badge" style="font-size: 0.55rem; color: #EF4444;"><i class="fa-solid fa-circle"></i> REC</span>
          <button class="btn-cerrar-cam" onclick="cerrarCamaraMovil()" title="Cerrar Transmisión"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <img id="movil-cam-video" class="movil-cam-video" src="" alt="Transmisión en vivo">
      <div id="movil-cam-fallback" class="movil-cam-fallback">
        <span>El navegador bloqueó el stream HTTP dentro de HTTPS o la cámara no responde.</span>
        <a id="btn-abrir-stream-ext" href="#" target="_blank" rel="noopener noreferrer" class="btn-abrir-stream-ext">
          <i class="fa-solid fa-up-right-from-square"></i> Abrir cámara directa
        </a>
      </div>
    </div>

    <div id="ruta-info-panel">
      <div class="ruta-info-header">
        <span id="ruta-titulo-movil">📍 Recorrido Trazado</span>
        <button class="btn-cerrar-ruta" onclick="limpiarRutaMapa()" title="Limpiar Mapa"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="ruta-leyenda-dias" class="leyenda-dias"></div>
    </div>
  </div>

  <div id="sidebar">
    <div class="header-panel">
      <div class="title-row">
        <h1>SISTEMA ER9</h1>
        
        <div class="caja-consulta-wilson">
          <input type="text" id="input-consulta" placeholder="Pregunte a Wilson..." onkeydown="if(event.key==='Enter'){enviarConsultaTexto()}">
          <button class="btn-mic-wilson" id="btn-mic-wilson" onclick="toggleMicrofonoWilson()" title="Hablar con Wilson">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <button class="btn-enviar-consulta" onclick="enviarConsultaTexto()" title="Enviar a Wilson">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyAAI6JpVC7XY2keuLkApXApDVSETnKf425Mn44UC6_Qj5liBi7IcpJO4R-Fg6RHSBc/exec";
    
    function crearRunner(onSuccess, onFailure) {
      const llamar = (accion, payload = {}) => {
        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion, ...payload })
        })
        .then(res => res.json())
        .then(data => { if (onSuccess) onSuccess(data); })
        .catch(err => { if (onFailure) onFailure(err); });
      };
      return {
        withSuccessHandler: (fn) => crearRunner(fn, onFailure),
        withFailureHandler: (fn) => crearRunner(onSuccess, fn),
        obtenerDatosFlota: () => llamar("obtenerDatosFlota"),
        obtenerRutaMovil: (idMovil, fechaFiltro) => llamar("obtenerRutaMovil", { idMovil, fechaFiltro }),
        obtenerAlertasActivas: () => llamar("obtenerAlertasActivas"),
        desactivarAlerta: (idAlerta) => llamar("desactivarAlerta", { idAlerta }),
        procesarConsultaGemini: (textoEscuchado, fechaFiltro) => llamar("procesarConsultaGemini", { textoEscuchado, fechaFiltro }),
        obtenerGeocercas: () => llamar("obtenerGeocercas")
      };
    }
    window.google = { script: { run: crearRunner(null, null) } };
  
    function sanitizar(texto) {

    const USUARIO_DEMO = "Gustavo Fabián";
    const capaDia = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
    const capaNoche = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'mapa-modo-noche', attribution: '&copy; OpenStreetMap' });
    const capaSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google Satellite' });

    function toggleConsolaDron() {
      const panelComandos = document.getElementById('panel-comandos-dron');

    }
  
    // =================================================================
    // CÁMARAS: IP WEBCAM (CON CICLO 12s/5s + SILENCIO) Y VLC/RTSP FIJA
    // =================================================================
    let cicloGrabacionActivo = false;
    let timeoutCicloGrabacion = null;
    let ultimaIpCamara = '';
    let esIpWebcamActual = false;

    function esStreamIpWebcam(ipCruda) {
      const s = String(ipCruda || "").toLowerCase().trim();
      if (!s || s.startsWith("rtsp://") || s.includes(".m3u8") || s.includes(".mp4") || s.includes("/stream")) {
        return false;
      }
      // Si es IP:puerto pelada (ej: 192.168.100.119:8080) o termina en /video, es IP Webcam
      return /^https?:\/\/[^\/]+(\/video)?\/?$/.test(s) || /^[^\/:]+:\d+(\/video)?\/?$/.test(s);
    }
  
    function iniciarCicloGrabacion(ipBase) {
      if (cicloGrabacionActivo || !ipBase) return;
      cicloGrabacionActivo = true;
      
      // Asegurar silencio en IP Webcam al iniciar transmisión
      fetch('http://' + ipBase + '/settings/audio?set=off', { mode: 'no-cors' }).catch(() => {});

      function pasoDelCiclo() {
        if (!cicloGrabacionActivo) return;
        // Graba 12 segundos
        fetch('http://' + ipBase + '/settings/record?set=on', { mode: 'no-cors' }).catch(() => {});
        timeoutCicloGrabacion = setTimeout(() => {
          if (!cicloGrabacionActivo) return;
          // Corta y pausa 5 segundos para cuidar datos y batería
          fetch('http://' + ipBase + '/settings/record?set=off', { mode: 'no-cors' }).catch(() => {});
          timeoutCicloGrabacion = setTimeout(pasoDelCiclo, 5000);
        }, 12000);
      }
      pasoDelCiclo();
    }
  
    function detenerCicloGrabacion(ipBase) {
      cicloGrabacionActivo = false;
      clearTimeout(timeoutCicloGrabacion);
      timeoutCicloGrabacion = null;
      if (ipBase && esIpWebcamActual) {
        fetch('http://' + ipBase + '/settings/record?set=off', { mode: 'no-cors' }).catch(() => {});
      }
    }
  
    function abrirCamaraMovil(nombre, ipDestino) {
      if (!ipDestino || ipDestino === "undefined" || ipDestino.trim() === "" || ipDestino.toLowerCase().includes("transmisión en vivo")) {
        hablarWilson("El móvil " + nombre + " no tiene dirección de cámara configurada en la planilla, jefe.", true);
        return;
      }

      detenerCicloGrabacion(ultimaIpCamara);

      let rawUrl = ipDestino.trim();
      esIpWebcamActual = esStreamIpWebcam(rawUrl);
      let urlVideo = rawUrl;

      if (!urlVideo.startsWith('http://') && !urlVideo.startsWith('https://') && !urlVideo.startsWith('rtsp://')) {
        urlVideo = 'http://' + urlVideo;
      }

      // Solo agregamos /video si es un celular con IP Webcam sin ruta definida
      if (esIpWebcamActual && !urlVideo.includes('/video')) {
        urlVideo = urlVideo.replace(/\/+$/, '') + '/video';
      }

      ultimaIpCamara = urlVideo.replace(/^https?:\/\//, '').replace(/\/video\/?$/, '').replace(/\/$/, '');
      
      const cajaCam = document.getElementById('movil-cam-box');
      const imgVideo = document.getElementById('movil-cam-video');
      const fallbackBox = document.getElementById('movil-cam-fallback');
      const linkExt = document.getElementById('btn-abrir-stream-ext');
      const titulo = document.getElementById('movil-cam-titulo');
      const recBadge = document.getElementById('movil-cam-rec-badge');
  
      titulo.innerHTML = '<i class="fa-solid fa-video"></i> VIVO: ' + sanitizar(nombre);
      linkExt.href = urlVideo;
      if (recBadge) recBadge.style.display = esIpWebcamActual ? 'inline' : 'none';
  
      imgVideo.style.display = 'block';
      fallbackBox.style.display = 'none';
  
      imgVideo.onerror = function() {
        imgVideo.style.display = 'none';
        fallbackBox.style.display = 'flex';
      };
  
      imgVideo.src = urlVideo;
      cajaCam.classList.remove('oculto');

      if (esIpWebcamActual) {
        hablarWilson("Conectando cámara silenciosa del " + nombre + ", jefe. Grabación en intervalos activada.", true);
        iniciarCicloGrabacion(ultimaIpCamara);
      } else {
        hablarWilson("Conectando señal fija de " + nombre + ", jefe.", true);
      }
    }
  
    function cerrarCamaraMovil() {
      const cajaCam = document.getElementById('movil-cam-box');
      const imgVideo = document.getElementById('movil-cam-video');
      const fallbackBox = document.getElementById('movil-cam-fallback');
      imgVideo.onerror = null;
      imgVideo.src = "";
      imgVideo.style.display = 'block';
      fallbackBox.style.display = 'none';
      cajaCam.classList.add('oculto');
      detenerCicloGrabacion(ultimaIpCamara);
      hablarWilson("Transmisión cerrada, jefe.", true);
    }
  
    // =================================================================
    // SÍNTESIS Y RECONOCIMIENTO DE VOZ OPTIMIZADO PARA ESPAÑOL ARGENTINO
    // =================================================================
    let vocesCargadas = [];
    let vozArgentinaElegida = null;
    let reconocimientoVoz = null;
    let escuchandoAhora = false;
    let timerNegativaPendiente = null;
    let ultimaAccionExitosaTs = 0;
  
    function seleccionarMejorVozArgentina(lista) {
      if (!lista || lista.length === 0) return null;
      // 1. Prioridad absoluta: Español de Argentina (es-AR o es_AR)
      let ar = lista.filter(v => {
        const l = String(v.lang || "").toLowerCase().replace('_', '-');
        return l === 'es-ar' || l.startsWith('es-ar');
      });
      if (ar.length > 0) {
        return ar.find(v => v.name.toLowerCase().includes('google') || v.name.toLowerCase().includes('tomas') || v.name.toLowerCase().includes('male')) || ar[0];
      }
      // 2. Segunda opción: Español Latinoamérica (es-419, es-UY, es-MX, es-US) evitando es-ES (España)
      let latam = lista.filter(v => {
        const l = String(v.lang || "").toLowerCase().replace('_', '-');
        return l.startsWith('es-') && l !== 'es-es';
      });
      if (latam.length > 0) {
        return latam.find(v => v.name.toLowerCase().includes('google')) || latam[0];
      }
      // 3. Cualquier voz en español
      return lista.find(v => String(v.lang || "").toLowerCase().startsWith('es')) || null;
    }

    function cargarVocesDisponibles() {
      if ('speechSynthesis' in window) {
        const lista = window.speechSynthesis.getVoices();
        if (lista && lista.length > 0) {
          vocesCargadas = lista;
          vozArgentinaElegida = seleccionarMejorVozArgentina(vocesCargadas);
        }
      }
    }
    
    if ('speechSynthesis' in window) {
      cargarVocesDisponibles();
      window.speechSynthesis.onvoiceschanged = cargarVocesDisponibles;
      // Reintento temprano por si Android/Chromium demora en cargar las voces
      setTimeout(cargarVocesDisponibles, 300);
      setTimeout(cargarVocesDisponibles, 1200);
    }
  
    function esFraseNegativa(texto) {
      const t = String(texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return t.includes("no encontr") ||
             t.includes("no lo encontr") ||
             t.includes("repit") ||
             t.includes("no te entend") ||
             t.includes("no entend") ||
             t.includes("no pude") ||
             t.includes("decime bien");
    }
  
    function ejecutarLocucion(textoLimpio) {
      if (!('speechSynthesis' in window)) return;
      if (typeof reconocimientoVoz !== 'undefined' && reconocimientoVoz && escuchandoAhora) {
        try { reconocimientoVoz.stop(); } catch(e){}
      }
      if (!vozArgentinaElegida) cargarVocesDisponibles();
      window.speechSynthesis.cancel();

      const textoLow = textoLimpio.toLowerCase();
      if (textoLow.includes("object") || textoLow.includes("undefined") || textoLimpio.length < 2) {
        textoLimpio = "Entendido, jefe.";
      }

      setTimeout(() => {
        window.locucionActual = new SpeechSynthesisUtterance(textoLimpio);
        window.locucionActual.lang = 'es-AR';
        window.locucionActual.rate = 1.02;
        window.locucionActual.pitch = 0.96;
        
        if (vozArgentinaElegida) {
          window.locucionActual.voice = vozArgentinaElegida;
        }
        
        window.speechSynthesis.speak(window.locucionActual);
      }, 90);
    }
  
    function hablarWilson(textoOriginal, esAccionExitosa = false) {
      if (!('speechSynthesis' in window)) return;
      let textoLimpio = String(textoOriginal || "").replace(/[{}"'\n\r\[\]]/g, " ").trim();
      const esNeg = esFraseNegativa(textoLimpio);
      
      if (esAccionExitosa && !esNeg) {
        clearTimeout(timerNegativaPendiente);
        timerNegativaPendiente = null;
        ultimaAccionExitosaTs = Date.now();
        ejecutarLocucion(textoLimpio);
        return;
      }
      if (Date.now() - ultimaAccionExitosaTs < 3000) {
        return;
      }
      if (esNeg) {
        clearTimeout(timerNegativaPendiente);
        timerNegativaPendiente = setTimeout(() => {
          if (Date.now() - ultimaAccionExitosaTs >= 3000) {
            ejecutarLocucion(textoLimpio);
          }
        }, 900);
        return;
      }
      ejecutarLocucion(textoLimpio);
    }
  
    function inicializarReconocimientoVoz() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return null;
      const rec = new SpeechRecognition();
      rec.lang = 'es-AR';
      rec.continuous = false;
      rec.interimResults = false;
      rec.maxAlternatives = 1;
  
      rec.onstart = function() {
        escuchandoAhora = true;
        const btnMic = document.getElementById('btn-mic-wilson');
        const input = document.getElementById('input-consulta');
        if (btnMic) btnMic.classList.add('escuchando');
        if (input) input.placeholder = "Escuchando su orden, jefe...";
      };
  
      rec.onresult = function(event) {
        const lastIdx = event.results.length - 1;
        const transcripcion = String(event.results[lastIdx][0].transcript || "")
          .replace(/[.,!?¿¡]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
        if (!transcripcion) return;
        const input = document.getElementById('input-consulta');
        if (input) input.value = transcripcion;
        setTimeout(enviarConsultaTexto, 100);
      };
  
      rec.onerror = function(event) {
        if (event.error === 'not-allowed') {
          hablarWilson("Verifique los permisos de micrófono en el navegador, jefe.");
        } else if (event.error === 'network' || event.error === 'service-not-allowed') {
          hablarWilson("El servicio de voz fue bloqueado por la red o el navegador. Puede escribir su orden en la caja de texto, jefe.");
        }
      };
  
      rec.onend = function() {
        escuchandoAhora = false;
        const btnMic = document.getElementById('btn-mic-wilson');
        const input = document.getElementById('input-consulta');
        if (btnMic) btnMic.classList.remove('escuchando');
        if (input) input.placeholder = "Pregunte a Wilson...";
      };
      return rec;
    }
  
    function toggleMicrofonoWilson() {
      if (!reconocimientoVoz) {
        reconocimientoVoz = inicializarReconocimientoVoz();
      }
      if (!reconocimientoVoz) {
        hablarWilson("Este navegador no soporta entrada de voz. Escriba su orden en la caja de consulta, jefe.");
        return;
      }
      if (escuchandoAhora) {
        reconocimientoVoz.stop();
      } else {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        try {
          reconocimientoVoz.start();
        } catch (e) {
          console.error("Error micrófono:", e);
        }
      }
    }
  
    function obtenerNombreUsuarioReal() {
      let u = String(USUARIO_DEMO || "").trim();
      return (!u || u.includes("?") || u.includes("usuarioParam")) ? "Gustavo Fabián" : u;
    }
  
    function formatearCombustible(m) {
      let raw = m.combustible ?? m.nivel_combustible ?? m.nivelCombustible ?? m.tanque ?? "";
      let str = String(raw).trim();
      if (!str || str === "undefined" || str === "null" || str === "N/D") return "N/D";
      if (str.includes('%')) return str;
      let val = parseFloat(str.replace(',', '.'));
      if (isNaN(val)) return "N/D";
      if (val > 0 && val <= 1) return Math.round(val * 100) + "%";
      return Math.round(val) + "%";
    }
  
    function obtenerNumeroCombustible(m) {
      const str = formatearCombustible(m);
      if (str === "N/D") return NaN;
      return parseFloat(str.replace('%', ''));
    }
  
    function obtenerNumeroBateria(m) {
      const str = formatearBateria(m.bateria);
      if (!str || str === "N/D") return NaN;
      return parseFloat(str.replace('%', ''));
    }
  
    function obtenerKmDiaNumero(m) {
      let raw = m.km_dia ?? m.kmDia ?? 0;
      let val = parseFloat(String(raw).replace(',', '.'));
      return isNaN(val) ? 0 : val;
    }
  
    function obtenerKmMesNumero(m) {
      let raw = m.kilometro_mes ?? m.kilometros_mes ?? m.km_mes ?? m.kmMes ?? 0;
      let val = parseFloat(String(raw).replace(',', '.'));
      return isNaN(val) ? 0 : val;
    }
  
    function obtenerKmTotalesNumero(m) {
      let raw = m.kilometros_totales ?? m.km_totales ?? m.km_total ?? m.odometro ?? m.kmTotales;
      if (raw !== undefined && raw !== null && String(raw).trim() !== "") {
        let val = parseFloat(String(raw).replace(',', '.'));
        if (!isNaN(val)) return val;
      }
      return obtenerKmMesNumero(m);
    }
  
    function generarReporteNovedadesYAlertas(soloAlertasOficiales = false) {
      const bloques = [];
  
      if (alertasActuales && alertasActuales.length > 0) {
        const listaAlertas = alertasActuales.map(a => a.movil + " (" + a.tipo + ": " + a.detalle + ")").join("; ");
        bloques.push("Hay " + alertasActuales.length + " alertas pendientes en el historial: " + listaAlertas + ".");
      }
  
      const alertasEnFlota = flotaActual.filter(m => {

    function parsearFechaNatural(texto) {
      const t = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const d = new Date();
      if (t.includes("ayer")) {
        d.setDate(d.getDate() - 1);
        return d.toLocaleDateString('en-CA');
      }
      if (t.includes("hoy")) {
        return d.toLocaleDateString('en-CA');
      }
      const matchDia = t.match(/\b(\d{1,2})\b/);
      if (matchDia && (t.includes("dia") || t.includes("del") || esperandoFechaParaMovil)) {
        const dia = matchDia[1].padStart(2, '0');
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const anio = d.getFullYear();
        return `${anio}-${mes}-${dia}`;
      }
      return null;
    }
  
    function buscarMovilEnFlota(frase) {
      if (!frase || !flotaActual || flotaActual.length === 0) return null;
      
      let limpio = String(frase)
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s]/gi, ' ')
        .replace(/\b0+(\d+)\b/g, '$1')
        .trim();
  
      const numMap = {
        "uno":"1", "una":"1", "primero":"1", "i":"1",
        "dos":"2", "do":"2", "to":"2", "segundo":"2", "ii":"2",
        "tres":"3", "tre":"3", "tercero":"3", "iii":"3",
        "cuatro":"4", "for":"4", "por":"4", "four":"4", "cuarto":"4", "iv":"4",
        "cinco":"5", "sinco":"5", "quinto":"5", "v":"5",
        "seis":"6", "sey":"6", "sexto":"6", "vi":"6",
        "siete":"7", "septimo":"7", "vii":"7",
        "ocho":"8", "octavo":"8", "viii":"8",
        "nueve":"9", "noveno":"9", "ix":"9",
        "diez":"10", "decimo":"10", "x":"10"
      };
  
      for (let w in numMap) {
        limpio = limpio.replace(new RegExp(`\\b${w}\\b`, "g"), numMap[w]);
      }
  
      let matchNum = limpio.match(/\d+/);
      if (matchNum) {
        let numHab = matchNum[0];
        let encNum = flotaActual.find(m => {
          let mN = String(m.nombre || "").match(/\d+/);
          let mI = String(m.id || "").match(/\d+/);
          return (mN && mN[0] === numHab) || (mI && mI[0] === numHab);
        });
        if (encNum) return encNum;
      }
      
      let encontrado = flotaActual.find(m => {
        let n = String(m.nombre).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').trim();
        let i = String(m.id).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').trim();
        return (n && limpio.includes(n)) || (i && limpio.includes(i)) || n === limpio;
      });
  
      if (encontrado) return encontrado;
      if (limpio.includes("azul")) return flotaActual.find(m => String(m.id).includes("24848479") || String(m.nombre).toLowerCase().includes("azul"));
      if (limpio.includes("blanco")) return flotaActual.find(m => String(m.id).includes("47961388") || String(m.nombre).toLowerCase().includes("blanco"));
      if (limpio.includes("auditor") || limpio.includes("jose")) return flotaActual.find(m => String(m.id).includes("31222059") || String(m.nombre).toLowerCase().includes("auditor") || String(m.nombre).toLowerCase().includes("jose"));
      if (limpio.includes("admin") || limpio.includes("syta") || limpio.includes("cita")) return flotaActual.find(m => String(m.id).includes("77903373") || String(m.nombre).toLowerCase().includes("admin") || String(m.nombre).toLowerCase().includes("syta"));
      if (limpio.includes("udl")) return flotaActual.find(m => String(m.id).toLowerCase().includes("udl") || String(m.nombre).toLowerCase().includes("udl"));
      return null;
    }

    function abrirUrlExternaSegura(url) {
      if (!url || url.includes("NaN")) return;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  
    function abrirStreetView(lat, lng) {
      abrirUrlExternaSegura(obtenerUrlStreetView(lat, lng));

    function mostrarGeocercasEnMapa(zonas) {
      if (capaGeocercas) {
        map.removeLayer(capaGeocercas);
        capaGeocercas = null;
      }
      if (!zonas || zonas.length === 0) return;
      capaGeocercas = L.featureGroup();
      zonas.forEach(z => {
        const circulo = L.circle([z.lat, z.lng], {
          radius: z.radio,
          color: '#06B6D4',
          fillColor: '#06B6D4',
          fillOpacity: 0.15,
          weight: 2
        }).bindPopup('<b>Geocerca: ' + sanitizar(z.nombre) + '</b><br>Radio permitido: ' + z.radio + ' m');
        capaGeocercas.addLayer(circulo);
      });
      capaGeocercas.addTo(map);
      map.fitBounds(capaGeocercas.getBounds(), { padding: [50, 50] });
    }

                 let lngM = strCrudo.match(/"lng"\s*:\s*(-?\d{1,3}[\.,]\d+)/i) || strCrudo.match(/(-6[456][\.,]\d+)/);

             textoHablar = textoHablar.replace(/\{|\}|"|'|```json|```|acci[oó]n:|m[oó]vil[_\s]*id:|texto:/gi, "").trim();

      const card = document.getElementById('card-' + m.id);
      if (card) {

      }
      let lat = parseFloat(String(m.lat || "").replace(',', '.'));
      let lng = parseFloat(String(m.lng || "").replace(',', '.'));
      if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
        if (textoPersonalizado !== false) {
            let t = textoPersonalizado || ("Enfocando el " + m.nombre + ", jefe.");
            t = t.replace(/\{|\}|"|'|```|json/g, "").trim();
            hablarWilson(t, true);

      } else {
        hablarWilson("El móvil fue localizado pero no cuenta con coordenadas numéricas válidas en este momento, jefe.", true);

    function formatearBateria(batCrudaStr) {
      let batStr = String(batCrudaStr || "").trim();
      if (batStr.includes('%')) return batStr;
      let val = parseFloat(batStr);
      if (isNaN(val)) return "100%";
      if (val > 0 && val <= 1) return Math.round(val * 100) + "%";
      if (val > 1) return Math.round(val) + "%";
      return "100%";
    }

      const huboCambios = (nuevaFirma !== firmaFlotaAnterior);

          primerPuntoValido = [
            parseFloat(String(m.lat).replace(',','.')),

              hablarWilson("El " + m.nombre + " se ha detenido, jefe.", true);

              hablarWilson("Atención: el " + m.nombre + " supera la velocidad habitual con " + vel + " km/h, jefe.", true);

        estadosPreviosMoviles[m.id] = { estado: estadoActual, velocidad: vel };

        if (!huboCambios) return;

        const urlWsp = obtenerUrlWhatsApp(nomLimpio, latSana, lngSana, vel, estadoActual);

        if (marcadores[m.id]) {

              '<span class="telemetria-pill" title="Batería"><i class="fa-solid fa-battery-half"></i> ' + bateriaFormateada + '</span>' +

            '<div class="card-vel"><i class="fa-solid fa-gauge-high"></i> ' + vel + ' <span style="font-size: 0.65rem;">KM/H</span></div>' +

    function dibujarRutaEnMapa(puntos, nombreMovil, fechaSel) {
      limpiarRutaMapa();
      if (!puntos || puntos.length === 0) {
        hablarWilson("No se registran posiciones guardadas para el " + nombreMovil + " en esa fecha, jefe.", true);
        return;
      }
      capaRutaActual = L.featureGroup();
      const gruposPorDia = {};
      puntos.forEach(function(p) {
        const dia = p.fechaIso || "Sin Fecha";
        if (!gruposPorDia[dia]) gruposPorDia[dia] = [];
        gruposPorDia[dia].push(p);
      });
  
      const fechasUnicas = Object.keys(gruposPorDia);
      const panelLeyenda = document.getElementById('ruta-leyenda-dias');
      panelLeyenda.innerHTML = '';
  
      fechasUnicas.forEach(function(fechaIso, index) {
        const colorEstilo = PALETA_NEON[index % PALETA_NEON.length];
        const puntosDia = gruposPorDia[fechaIso];
        
        const latlngs = puntosDia.map(function(p) { 
          return [parseFloat(String(p.lat).replace(',','.')), parseFloat(String(p.lng).replace(',','.'))]; 
        });
  
        if (latlngs.length > 1) {
          const lineaResplandor = L.polyline(latlngs, {
            color: colorEstilo.glow, weight: 10, opacity: 0.55, lineCap: 'round', lineJoin: 'round'
          });
          const lineaCentral = L.polyline(latlngs, {
            color: colorEstilo.core, weight: 3.5, opacity: 0.95, lineCap: 'round', lineJoin: 'round'
          });
          capaRutaActual.addLayer(lineaResplandor);
          capaRutaActual.addLayer(lineaCentral);
        }
  
        puntosDia.forEach(function(p, i) {
          let colorPunto = colorEstilo.glow;
          let radio = 5.5;
          if (i === 0) { colorPunto = '#10B981'; radio = 8; } 
          else if (i === puntosDia.length - 1) { colorPunto = '#EF4444'; radio = 8.5; }
  
          let latP = parseFloat(String(p.lat).replace(',','.'));
          let lngP = parseFloat(String(p.lng).replace(',','.'));
          const puntoMarker = L.circleMarker([latP, lngP], {
            radius: radio, fillColor: colorPunto, color: '#FFFFFF', weight: 1.5, fillOpacity: 0.9
          }).bindPopup('<b>' + sanitizar(nombreMovil) + '</b><br>Hora: ' + p.fechaHora + '<br>Velocidad: ' + p.velocidad + ' km/h');
          capaRutaActual.addLayer(puntoMarker);
        });
  
        const fechaPartes = fechaIso.split('-');
        const fechaFormateada = (fechaPartes.length === 3) ? `${fechaPartes[2]}/${fechaPartes[1]}/${fechaPartes[0]}` : fechaIso;
        const itemLeyenda = document.createElement('div');
        itemLeyenda.className = 'item-leyenda-dia';
        itemLeyenda.innerHTML = `<div class="color-dot-leyenda" style="background: ${colorEstilo.glow}"></div><span>${fechaFormateada} (${puntosDia.length} pts)</span>`;
        panelLeyenda.appendChild(itemLeyenda);
      });
  
      capaRutaActual.addTo(map);
      if (capaRutaActual.bringToFront) capaRutaActual.bringToFront(); 
  
      const primerPunto = puntos[0];
      const ultimoPunto = puntos[puntos.length - 1];
      let pLat = parseFloat(String(primerPunto.lat).replace(',','.'));
      let pLng = parseFloat(String(primerPunto.lng).replace(',','.'));
  
      if (puntos.length === 1 || (primerPunto.lat === ultimoPunto.lat && primerPunto.lng === ultimoPunto.lng)) {
        map.setView([pLat, pLng], 17); 
      } else {
        map.fitBounds(capaRutaActual.getBounds(), { padding: [50, 50] });
      } 
  
      document.getElementById('ruta-titulo-movil').innerText = '📍 Recorrido: ' + sanitizar(nombreMovil);
      document.getElementById('ruta-info-panel').style.display = 'flex';
      hablarWilson("Recorrido del " + nombreMovil + " trazado en el radar, jefe.", true);
    } 
  
    actualizarFlota();
    verificarAlertasActivas();
    cargarGeocercasIniciales();
    setInterval(actualizarFlota, 12000);
    setInterval(verificarAlertasActivas, 15000);
  </script>
</body>
</html>
