<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SISTEMA ER9 - Control de Flota y Dron V5</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0B0F19; --bg-panel: #111827; --bg-card: #1F2937; --border-color: #374151;
      --text-main: #F9FAFB; --text-muted: #9CA3AF; --accent-cyan: #06B6D4; --accent-green: #10B981;
      --accent-red: #EF4444; --accent-wilson: #8B5CF6; --accent-maps: #2563EB; --accent-wsp: #25D366; --accent-drone: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); height: 100vh; width: 100vw; display: flex; overflow: hidden; }
    .mapa-modo-noche { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
    #sidebar { width: 390px; height: 100vh; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
    .header-panel { flex-shrink: 0; padding: 12px 14px; background: linear-gradient(180deg, #162032 0%, var(--bg-panel) 100%); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .title-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .title-row h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.5px; color: var(--accent-cyan); }
    .wilson-badge { display: flex; align-items: center; gap: 5px; background: rgba(139, 92, 246, 0.15); border: 1px solid var(--accent-wilson); color: #DDD6FE; padding: 4px 8px; border-radius: 16px; font-size: 0.7rem; font-weight: 700; cursor: pointer; }
    .wilson-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--accent-wilson); box-shadow: 0 0 6px var(--accent-wilson); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .caja-consulta-wilson { display: flex; align-items: center; gap: 5px; }
    .caja-consulta-wilson input { background: rgba(17, 24, 39, 0.9); border: 1px solid var(--accent-wilson); color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; outline: none; width: 120px; }
    .caja-consulta-wilson input::placeholder { color: var(--text-muted); }
    .btn-enviar-consulta { background: var(--accent-wilson); border: none; color: #fff; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
    .btn-enviar-consulta:hover { background: #7C3AED; box-shadow: 0 0 8px var(--accent-wilson); }
    .btn-mic-wilson { background: rgba(139, 92, 246, 0.2); border: 1px solid var(--accent-wilson); color: #DDD6FE; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
    .btn-mic-wilson:hover { background: var(--accent-wilson); color: #fff; }
    .btn-mic-wilson.escuchando { background: var(--accent-red); border-color: #FCA5A5; color: #FFFFFF; animation: latidoMic 1s infinite; }
    @keyframes latidoMic { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); } 70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    #alerta-banner { display: none; background: linear-gradient(90deg, rgba(220, 38, 38, 0.95) 0%, rgba(185, 28, 28, 0.95) 100%); border: 1px solid #f87171; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); color: #FFFFFF; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; animation: deslizarAbajo 0.3s ease-out; }
    @keyframes deslizarAbajo { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .alerta-icono-campana { display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #FEE2E2; animation: repiqueCampana 1s infinite ease-in-out; transform-origin: top center; }
    @keyframes repiqueCampana { 0% { transform: rotate(0); } 15% { transform: rotate(14deg); } 30% { transform: rotate(-14deg); } 45% { transform: rotate(10deg); } 60% { transform: rotate(-10deg); } 75% { transform: rotate(4deg); } 100% { transform: rotate(0); } }
    .alerta-cuerpo { display: flex; align-items: center; gap: 8px; flex: 1; }
    .btn-desactivar-alerta { background: #FFFFFF; color: #B91C1C; border: none; font-weight: 800; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.68rem; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: all 0.2s; white-space: nowrap; }
    .btn-desactivar-alerta:active { transform: scale(0.95); }
    .controles-superiores-row { display: flex; gap: 6px; align-items: center; }
    .fecha-filter-box { flex: 1; display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 5px 8px; }
    .fecha-filter-box label { font-size: 0.68rem; font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 4px; }
    .fecha-filter-box input[type="date"] { background: transparent; border: none; color: var(--text-main); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700; outline: none; color-scheme: dark; }
    .btn-toggle-dron-master { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--accent-drone); color: var(--accent-drone); padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; white-space: nowrap; }
    .btn-toggle-dron-master.activo { background: var(--accent-drone); color: #000; }
    .drone-command-panel { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--accent-drone); border-radius: 6px; padding: 8px; display: none; flex-direction: column; gap: 6px; animation: deslizarAbajo 0.2s ease-out; }
    .drone-command-panel.visible { display: flex; }
    .drone-command-title { font-size: 0.7rem; font-weight: 800; color: var(--accent-drone); display: flex; align-items: center; justify-content: space-between; text-transform: uppercase; }
    .drone-buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .btn-drone-cmd { background-color: var(--bg-card); border: 1px solid var(--accent-drone); color: var(--text-main); padding: 5px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all 0.2s; }
    .btn-drone-cmd:hover { background-color: var(--accent-drone); color: #000; }
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
    .stat-item { background-color: var(--bg-card); padding: 4px 2px; border-radius: 6px; border: 1px solid var(--border-color); }
    .stat-val { font-size: 0.95rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
    .stat-lbl { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
    #lista-moviles { flex: 1 1 auto; overflow-y: auto !important; -webkit-overflow-scrolling: touch !important; touch-action: pan-y !important; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; pointer-events: auto !important; }
    .card-movil { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color 0.2s ease, background-color 0.2s ease; flex-shrink: 0; }
    .card-movil.selected { border-color: var(--accent-cyan); background-color: #1E293B; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .movil-nombre { font-weight: 700; font-size: 0.88rem; color: #FFF; }
    .movil-id { font-size: 0.65rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .movil-badge { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; text-transform: uppercase; }
    .badge-movimiento { background-color: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-detenido { background-color: rgba(156, 163, 175, 0.2); color: var(--text-muted); border: 1px solid var(--border-color); }
    .card-body { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-muted); flex-wrap: wrap; gap: 6px; }
    .card-telemetria-extra { display: flex; gap: 8px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; flex-wrap: wrap; }
    .telemetria-pill { background: rgba(11, 15, 25, 0.6); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(55, 65, 81, 0.8); display: flex; align-items: center; gap: 4px; }
    .card-vel { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.88rem; color: var(--text-main); }
    .card-acciones { display: flex; gap: 4px; margin-top: 4px; }
    .btn-accion { flex: 1; display: flex; align-items: center; justify-content: center; gap: 3px; border: none; border-radius: 6px; padding: 6px 2px; font-size: 0.65rem; font-weight: 700; text-decoration: none; color: #FFFFFF; cursor: pointer; }
    .btn-street { background-color: var(--accent-maps); }
    .btn-wsp { background-color: var(--accent-wsp); }
    .btn-ruta { background-color: var(--accent-wilson); }
    .btn-drone { background-color: var(--accent-drone); color: #000; }
    .btn-cam { background-color: var(--accent-red); color: #FFF; }
    .btn-cam:hover { background-color: #DC2626; }
    #map { flex: 1; height: 100%; width: 100%; background-color: #0b0f19; position: relative; }
    .custom-movil-label { background: rgba(17, 24, 39, 0.95); border-radius: 6px; padding: 4px 8px; color: #ffffff; font-family: 'Inter', sans-serif; font-size: 11px; white-space: nowrap; text-align: center; user-select: none; cursor: pointer; }
    .neonu-detenido { box-shadow: 0 0 6px rgba(255, 165, 0, 0.7); border: 1.5px solid #ffa500; }
    .neonu-movimiento { box-shadow: 0 0 8px rgba(16, 185, 129, 0.9); border: 1.5px solid var(--accent-green); }
    .drone-cam-container { position: absolute; bottom: 20px; left: 20px; width: 300px; height: 195px; background-color: var(--bg-panel); border: 2px solid var(--accent-drone); border-radius: 8px; z-index: 1050; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.75); display: flex; flex-direction: column; }
    .drone-cam-container.oculto { display: none !important; }
    .drone-cam-header { flex-shrink: 0; background: rgba(245, 158, 11, 0.25); padding: 4px 8px; font-size: 0.65rem; font-weight: 800; color: var(--accent-drone); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .drone-video-wrapper { position: relative; width: 100%; flex: 1; background: #000; overflow: hidden; }
    .drone-cam-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; border: none; object-fit: cover; }
    .movil-cam-container { position: absolute; bottom: 20px; right: 20px; width: 320px; height: 220px; background-color: var(--bg-panel); border: 2px solid var(--accent-red); border-radius: 8px; z-index: 1100; overflow: hidden; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); display: flex; flex-direction: column; }
    .movil-cam-container.oculto { display: none !important; }
    .movil-cam-header { flex-shrink: 0; background: rgba(239, 68, 68, 0.2); padding: 5px 8px; font-size: 0.68rem; font-weight: 800; color: #F87171; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .movil-cam-header .btn-cerrar-cam { background: transparent; border: none; color: #FFF; cursor: pointer; font-size: 0.85rem; }
    .movil-cam-video { width: 100%; flex: 1; background: #000; object-fit: cover; }
    .movil-cam-fallback { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; flex: 1; padding: 12px; text-align: center; background: #0B0F19; color: var(--text-muted); font-size: 0.72rem; }
    .btn-abrir-stream-ext { background: var(--accent-red); color: #FFF; border: none; border-radius: 6px; padding: 6px 12px; font-size: 0.72rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    #ruta-info-panel { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(17, 24, 39, 0.92); border: 1px solid var(--accent-cyan); box-shadow: 0 4px 20px rgba(0,0,0,0.6); border-radius: 8px; padding: 8px 12px; display: none; flex-direction: column; gap: 6px; max-width: 300px; }
    .ruta-info-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 800; color: var(--accent-cyan); }
    .btn-cerrar-ruta { background: transparent; border: none; color: var(--accent-red); cursor: pointer; font-size: 0.9rem; }
    .leyenda-dias { display: flex; flex-direction: column; gap: 4px; font-size: 0.7rem; }
    .item-leyenda-dia { display: flex; align-items: center; gap: 8px; }
    .color-dot-leyenda { width: 10px; height: 10px; border-radius: 50%; }
    @media (max-width: 768px) {
      body { flex-direction: column; height: 100vh; height: 100dvh; }
      #map { order: 1; height: 50vh !important; height: 50dvh !important; width: 100vw; flex: none; }
      #sidebar { order: 2; width: 100vw; height: 50vh !important; height: 50dvh !important; max-height: 50vh !important; border-right: none; border-top: 2px solid var(--accent-cyan); }
      .drone-cam-container { width: 210px; height: 142px; bottom: 8px; left: 8px; }
      .drone-cam-header { padding: 3px 6px; font-size: 0.58rem; }
      .movil-cam-container { width: 190px; height: 130px; bottom: 8px; right: 8px; }
    }
  </style>
</head>
<body>
  <div id="map">
    <div id="drone-cam-box" class="drone-cam-container oculto">
      <div class="drone-cam-header">
        <span><i class="fa-solid fa-video"></i> VIVO - DRON ER9</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 0.55rem; color: #10B981;"><i class="fa-solid fa-circle"></i> REC</span>
          <button onclick="cerrarConsolaDron()" style="background: transparent; border: none; color: #FFF; cursor: pointer; font-size: 0.75rem;" title="Cerrar Dron"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="drone-video-wrapper">
        <iframe class="drone-cam-video" src="https://www.youtube.com/embed/8UBstbQjySY?autoplay=1&mute=1&loop=1&playlist=8UBstbQjySY&playsinline=1&controls=0&modestbranding=1&rel=0" title="Vista aérea - Dron ER9" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
    <div id="movil-cam-box" class="movil-cam-container oculto">
      <div class="movil-cam-header">
        <span id="movil-cam-titulo"><i class="fa-solid fa-video"></i> CÁMARA EN VIVO</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span id="movil-cam-rec-badge" style="font-size: 0.55rem; color: #EF4444;"><i class="fa-solid fa-circle"></i> REC</span>
          <button class="btn-cerrar-cam" onclick="cerrarCamaraMovil()" title="Cerrar Transmisión"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <img id="movil-cam-video" class="movil-cam-video" src="" alt="Transmisión en vivo">
      <div id="movil-cam-fallback" class="movil-cam-fallback">
        <span>El navegador bloqueó el stream HTTP dentro de HTTPS o la cámara no responde.</span>
        <a id="btn-abrir-stream-ext" href="#" target="_blank" rel="noopener noreferrer" class="btn-abrir-stream-ext"><i class="fa-solid fa-up-right-from-square"></i> Abrir cámara directa</a>
      </div>
    </div>
    <div id="ruta-info-panel">
      <div class="ruta-info-header">
        <span id="ruta-titulo-movil">📍 Recorrido Trazado</span>
        <button class="btn-cerrar-ruta" onclick="limpiarRutaMapa()" title="Limpiar Mapa"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="ruta-leyenda-dias" class="leyenda-dias"></div>
    </div>
  </div>
  <div id="sidebar">
    <div class="header-panel">
      <div class="title-row">
        <h1>SISTEMA ER9</h1>
        <div class="caja-consulta-wilson">
          <input type="text" id="input-consulta" placeholder="Pregunte a Wilson..." onkeydown="if(event.key==='Enter'){enviarConsultaTexto()}">
          <button class="btn-mic-wilson" id="btn-mic-wilson" onclick="toggleMicrofonoWilson()" title="Hablar con Wilson"><i class="fa-solid fa-microphone"></i></button>
          <button class="btn-enviar-consulta" onclick="enviarConsultaTexto()" title="Enviar a Wilson"><i class="fa-solid fa-paper-plane"></i></button>
          <div class="wilson-badge" onclick="forzarReporteWilson()" title="Escuchar reporte de Wilson">
            <span class="wilson-dot"></span><span>WILSON</span><i class="fa-solid fa-volume-high"></i>
          </div>
        </div>
      </div>
      <div id="alerta-banner">
        <div class="alerta-cuerpo">
          <div class="alerta-icono-campana"><i class="fa-solid fa-bell"></i></div>
          <span id="alerta-texto">Alerta operativa</span>
        </div>
        <button class="btn-desactivar-alerta" id="btn-silenciar" onclick="silenciarAlertaActual()">DESACTIVAR</button>
      </div>
      <div class="controles-superiores-row">
        <div class="fecha-filter-box">
          <label for="input-fecha-filtro"><i class="fa-regular fa-calendar-days"></i> Día:</label>
          <input type="date" id="input-fecha-filtro" onchange="alCambiarFechaFiltro()" />
        </div>
        <button class="btn-toggle-dron-master" id="btn-master-dron" onclick="toggleConsolaDron()" title="Abrir o Cerrar Consola del Dron"><i class="fa-solid fa-helicopter"></i> DRON</button>
      </div>
      <div class="drone-command-panel" id="panel-comandos-dron">
        <div class="drone-command-title">
          <span><i class="fa-solid fa-helicopter"></i> Comandos Dron ER9</span>
          <button onclick="cerrarConsolaDron()" style="background: transparent; border: 1px solid var(--accent-drone); color: var(--accent-drone); border-radius: 4px; padding: 2px 6px; font-size: 0.6rem; font-weight: 700; cursor: pointer;"><i class="fa-solid fa-eye-slash"></i> Ocultar</button>
        </div>
        <div class="drone-buttons-grid">
          <button class="btn-drone-cmd" onclick="ejecutarComandoGlobalDrone('Despegar y Orbitar')"><i class="fa-solid fa-plane-up"></i> Despegar</button>
          <button class="btn-drone-cmd" onclick="ejecutarComandoGlobalDrone('Ruta Perimetral')"><i class="fa-solid fa-route"></i> Perímetro</button>
          <button class="btn-drone-cmd" onclick="ejecutarComandoGlobalDrone('Modo Seguimiento')"><i class="fa-solid fa-crosshairs"></i> Seguir Móvil</button>
          <button class="btn-drone-cmd" onclick="ejecutarComandoGlobalDrone('Retorno a Base')"><i class="fa-solid fa-house-chimney"></i> RTB / Aterrizar</button>
        </div>
      </div>
      <div class="stats-bar">
        <div class="stat-item"><div class="stat-val" id="total-activos" style="color: var(--accent-cyan)">0</div><div class="stat-lbl">Móviles</div></div>
        <div class="stat-item"><div class="stat-val" id="total-movimiento" style="color: var(--accent-green)">0</div><div class="stat-lbl">Marcha</div></div>
        <div class="stat-item"><div class="stat-val" id="total-detenidos" style="color: var(--text-muted)">0</div><div class="stat-lbl">Detenidos</div></div>
      </div>
    </div>
    <div id="lista-moviles">
      <div style="text-align: center; color: var(--text-muted); padding: 15px; font-size: 0.8rem;">
        <i class="fa-solid fa-satellite fa-spin"></i> Conectando al búnker central...
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyAAI6JpVC7XY2keuLkApXApDVSETnKf425Mn44UC6_Qj5liBi7IcpJO4R-Fg6RHSBc/exec";
    
    function crearRunner(onSuccess, onFailure) {
      const llamar = (accion, payload = {}) => {
        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion, ...payload })
        })
        .then(res => res.json())
        .then(data => { if (onSuccess) onSuccess(data); })
        .catch(err => { if (onFailure) onFailure(err); });
      };
      return {
        withSuccessHandler: (fn) => crearRunner(fn, onFailure),
        withFailureHandler: (fn) => crearRunner(onSuccess, fn),
        obtenerDatosFlota: () => llamar("obtenerDatosFlota"),
        obtenerRutaMovil: (idMovil, fechaFiltro) => llamar("obtenerRutaMovil", { idMovil, fechaFiltro }),
        obtenerAlertasActivas: () => llamar("obtenerAlertasActivas"),
        desactivarAlerta: (idAlerta) => llamar("desactivarAlerta", { idAlerta }),
        procesarConsultaGemini: (textoEscuchado, fechaFiltro) => llamar("procesarConsultaGemini", { textoEscuchado, fechaFiltro }),
        obtenerGeocercas: () => llamar("obtenerGeocercas")
      };
    }
    if (!window.google || !window.google.script) {
      window.google = { script: { run: crearRunner(null, null) } };
    }
  
    function sanitizar(texto) {

      firmaFlotaAnterior = nuevaFirma;
      let countMov = 0, countDet = 0, primerPuntoValido = null;
      const fragmento = huboCambios ? document.createDocumentFragment() : null;
  
      moviles.forEach(function(m) {
        const vel = parseFloat(m.velocidad) || 0;
        const estadoActual = (m.estado === "En movimiento" || vel >= 3.5) ? "En movimiento" : "Detenido";
        if (estadoActual === "En movimiento") countMov++; else countDet++;
        if (!primerPuntoValido && m.lat && m.lng && m.lat !== 0) primerPuntoValido = [parseFloat(String(m.lat).replace(',','.')), parseFloat(String(m.lng).replace(',','.'))];
        if (!primeraVez && estadosPreviosMoviles[m.id]) {
          const prev = estadosPreviosMoviles[m.id];
          if (prev.estado === "Detenido" && estadoActual === "En movimiento") hablarWilson("El " + m.nombre + " inició marcha, jefe.", true);
          else if (prev.estado === "En movimiento" && estadoActual === "Detenido") hablarWilson("El " + m.nombre + " se ha detenido, jefe.", true);
          if (vel > 60 && prev.velocidad <= 60) hablarWilson("Atención: el " + m.nombre + " supera la velocidad habitual con " + vel + " km/h, jefe.", true);
        }
        estadosPreviosMoviles[m.id] = { estado: estadoActual, velocidad: vel };
        if (!huboCambios) return;
  
        const bateriaFormateada = formatearBateria(m.bateria), combustibleFormateado = formatearCombustible(m);
        const kmMesVal = obtenerKmMesNumero(m).toFixed(1).replace('.', ',');
        const claseNeon = (estadoActual === "En movimiento") ? 'neonu-movimiento' : 'neonu-detenido';
        const nomLimpio = sanitizar(m.nombre), idLimpio = sanitizar(m.id);
        const htmlEtiqueta = `<div class="custom-movil-label ${claseNeon}" onclick="enfocarMovilPorId('${idLimpio}')"><b>${nomLimpio}</b><br><span style="font-size: 10px; color: #9CA3AF;">Vel: ${vel} km/h | ⛽ ${combustibleFormateado}</span></div>`;
        const customIcon = L.divIcon({ html: htmlEtiqueta, className: 'marcador-custom', iconSize: [135, 45], iconAnchor: [67, 22] });
        let latSana = parseFloat(String(m.lat).replace(',','.')), lngSana = parseFloat(String(m.lng).replace(',','.'));
        const urlStreet = obtenerUrlStreetView(latSana, lngSana), urlWsp = obtenerUrlWhatsApp(nomLimpio, latSana, lngSana, vel, estadoActual);
        const ipCamara = m.ip || m.ip_privada || m.link_video || '';
  
        if (marcadores[m.id]) { marcadores[m.id].setLatLng([latSana, lngSana]); marcadores[m.id].setIcon(customIcon); }
        else { const marker = L.marker([latSana, lngSana], { icon: customIcon }).addTo(map); marker.on('click', () => enfocarMovil(m, false)); marcadores[m.id] = marker; }
  
        const card = document.createElement('div');
        card.className = 'card-movil' + (movilEnfocadoId === m.id ? ' selected' : '');
        card.id = 'card-' + idLimpio;
        card.onclick = () => enfocarMovil(m);
        card.innerHTML = '<div class="card-top"><div><div class="movil-nombre">' + nomLimpio + '</div><div class="movil-id">ID: ' + idLimpio + (m.zona_actual ? ' · ' + sanitizar(m.zona_actual) : '') + '</div></div><span class="movil-badge ' + (estadoActual === "En movimiento" ? 'badge-movimiento' : 'badge-detenido') + '">' + estadoActual + '</span></div>' +
          '<div class="card-body"><div class="card-telemetria-extra"><span class="telemetria-pill"><i class="fa-solid fa-battery-half"></i> ' + bateriaFormateada + '</span><span class="telemetria-pill" style="color: #FBBF24;"><i class="fa-solid fa-gas-pump"></i> ' + combustibleFormateado + '</span><span class="telemetria-pill" style="color: #38BDF8;"><i class="fa-solid fa-road"></i> ' + kmMesVal + ' km</span></div><div class="card-vel"><i class="fa-solid fa-gauge-high"></i> ' + vel + ' <span style="font-size: 0.65rem;">KM/H</span></div></div>' +
          '<div class="card-acciones" onclick="event.stopPropagation()"><a href="' + urlStreet + '" target="_blank" class="btn-accion btn-street"><i class="fa-solid fa-street-view"></i></a><a href="' + urlWsp + '" target="_blank" class="btn-accion btn-wsp"><i class="fa-brands fa-whatsapp"></i></a><button class="btn-accion btn-ruta" onclick="cargarRutaMovil(\'' + idLimpio + '\', \'' + nomLimpio + '\')"><i class="fa-solid fa-route"></i></button><button class="btn-accion btn-drone" onclick="comandarDrone(\'' + nomLimpio + '\')"><i class="fa-solid fa-helicopter"></i></button><button class="btn-accion btn-cam" onclick="abrirCamaraMovil(\'' + nomLimpio + '\', \'' + ipCamara + '\')"><i class="fa-solid fa-video"></i></button></div>';
        fragmento.appendChild(card);
      });

      if (huboCambios && fragmento) { listaContainer.innerHTML = ''; listaContainer.appendChild(fragmento); }
      document.getElementById('total-activos').innerText = moviles.length;
      document.getElementById('total-movimiento').innerText = countMov;
      document.getElementById('total-detenidos').innerText = countDet;
  
      if (primeraVez) {
        primeraVez = false; map.invalidateSize();
        const movilAdmin = moviles.find(m => (m.nombre || "").toLowerCase().includes('syta') || String(m.id) === '77903373');
        let centroInicial = (movilAdmin && movilAdmin.lat && movilAdmin.lng) ? [parseFloat(String(movilAdmin.lat).replace(',','.')), parseFloat(String(movilAdmin.lng).replace(',','.'))] : primerPuntoValido;
        if (centroInicial && !isNaN(centroInicial[0])) map.setView(centroInicial, 17);
        hablarWilson("Sistema en línea para " + obtenerNombreUsuarioReal() + ". Tenemos " + moviles.length + " móviles reportando: " + countMov + " en marcha y " + countDet + " detenidos, jefe.", true);
      }
    }
  
    function enfocarMovilPorId(idBuscado) { const movil = flotaActual.find(item => String(item.id) === String(idBuscado)); if (movil) enfocarMovil(movil); }
    function cargarRutaMovil(idMovil, nombreMovil) {
      movilRutaActiva = { id: idMovil, nombre: nombreMovil };
      const fechaSel = document.getElementById('input-fecha-filtro').value;
      hablarWilson("Cargando el recorrido del " + nombreMovil + ", jefe...", true);
      google.script.run.withSuccessHandler(puntos => dibujarRutaEnMapa(puntos, nombreMovil)).obtenerRutaMovil(idMovil, fechaSel);
    }
    function limpiarRutaMapa() { if (capaRutaActual) { map.removeLayer(capaRutaActual); capaRutaActual = null; } document.getElementById('ruta-info-panel').style.display = 'none'; movilRutaActiva = null; }
  
    function dibujarRutaEnMapa(puntos, nombreMovil) {
      limpiarRutaMapa();
      if (!puntos || puntos.length === 0) { hablarWilson("No se registran posiciones guardadas para el " + nombreMovil + " en esa fecha, jefe.", true); return; }
      capaRutaActual = L.featureGroup();
      const gruposPorDia = {};
      puntos.forEach(p => { const dia = p.fechaIso || "Sin Fecha"; if (!gruposPorDia[dia]) gruposPorDia[dia] = []; gruposPorDia[dia].push(p); });
      const panelLeyenda = document.getElementById('ruta-leyenda-dias'); panelLeyenda.innerHTML = '';
      Object.keys(gruposPorDia).forEach((fechaIso, index) => {
        const colorEstilo = PALETA_NEON[index % PALETA_NEON.length], puntosDia = gruposPorDia[fechaIso];
        const latlngs = puntosDia.map(p => [parseFloat(String(p.lat).replace(',','.')), parseFloat(String(p.lng).replace(',','.'))]);
        if (latlngs.length > 1) {
          capaRutaActual.addLayer(L.polyline(latlngs, { color: colorEstilo.glow, weight: 10, opacity: 0.55 }));
          capaRutaActual.addLayer(L.polyline(latlngs, { color: colorEstilo.core, weight: 3.5, opacity: 0.95 }));
        }
        puntosDia.forEach((p, i) => {
          let colorPunto = i === 0 ? '#10B981' : (i === puntosDia.length - 1 ? '#EF4444' : colorEstilo.glow);
          let radio = (i === 0 || i === puntosDia.length - 1) ? 8 : 5.5;
          capaRutaActual.addLayer(L.circleMarker([parseFloat(String(p.lat).replace(',','.')), parseFloat(String(p.lng).replace(',','.'))], { radius: radio, fillColor: colorPunto, color: '#FFFFFF', weight: 1.5, fillOpacity: 0.9 }).bindPopup('<b>' + sanitizar(nombreMovil) + '</b><br>Hora: ' + p.fechaHora + '<br>Velocidad: ' + p.velocidad + ' km/h'));
        });
        const f = fechaIso.split('-');
        panelLeyenda.innerHTML += `<div class="item-leyenda-dia"><div class="color-dot-leyenda" style="background: ${colorEstilo.glow}"></div><span>${f.length === 3 ? f[2]+'/'+f[1]+'/'+f[0] : fechaIso} (${puntosDia.length} pts)</span></div>`;
      });
      capaRutaActual.addTo(map);
      if (puntos.length === 1) map.setView([parseFloat(String(puntos[0].lat).replace(',','.')), parseFloat(String(puntos[0].lng).replace(',','.'))], 17);
      else map.fitBounds(capaRutaActual.getBounds(), { padding: [50, 50] });
      document.getElementById('ruta-titulo-movil').innerText = '📍 Recorrido: ' + sanitizar(nombreMovil);
      document.getElementById('ruta-info-panel').style.display = 'flex';
      hablarWilson("Recorrido del " + nombreMovil + " trazado en el radar, jefe.", true);
    }
  
    actualizarFlota();
    verificarAlertasActivas();
    cargarGeocercasIniciales();
    setInterval(actualizarFlota, 12000);
    setInterval(verificarAlertasActivas, 15000);
  </script>
</body>
</html>
